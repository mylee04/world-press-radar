name: Preflight Typecheck

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  typecheck:
    name: Typecheck (preflight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run preflight

  world-news-sources-mcp:
    name: World News Sources MCP (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/world-news-sources-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check package types
        run: npm run typecheck

      - name: Test package and deployment guards
        run: npm test
